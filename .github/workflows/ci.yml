name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Check formatting
        run: ./gradlew --no-daemon ktlintCheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the API documentation
        run: ./gradlew --no-daemon :dokkaGeneratePublicationHtml javadocJar

      - name: Confirm the docs and the javadoc jars have content
        run: |
          test -s build/dokka/html/index.html
          pages=$(find build/dokka/html -name '*.html' | wc -l)
          echo "rendered pages: $pages"
          test "$pages" -gt 50
          for jar in kotlin/build/libs/*-javadoc.jar spectron/build/libs/*-javadoc.jar; do
            entries=$(unzip -l "$jar" | tail -1 | awk '{print $2}')
            echo "$jar: $entries entries"
            test "$entries" -gt 50
          done

      - name: Upload the API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: build/dokka/html

  jvm:
    name: jvm (${{ matrix.surrealdb }})
    runs-on: ubuntu-latest
    # A green run against a floating tag changes meaning whenever SurrealDB
    # publishes, without a commit here. The pinned version is what the suite is
    # developed against and is the one that can fail the build; `latest` rides
    # along as an early warning that a future server release breaks the client,
    # non-blocking because that is someone else's release, not this change.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - surrealdb: "surrealdb/surrealdb:v3.2.4"
            blocking: true
          - surrealdb: "surrealdb/surrealdb:latest"
            blocking: false
    env:
      SURREAL_RUN_INTEGRATION: "true"
      SURREAL_JVM_ENDPOINT: "http://127.0.0.1:8000"
      SURREALDB_IMAGE: ${{ matrix.surrealdb }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify publication metadata
        run: ./gradlew --no-daemon verifyPublicationCoordinates verifyPublicationJavadoc

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 "$SURREALDB_IMAGE" start --user root --pass root memory
          for i in {1..20}; do
            if curl -fsS "$SURREAL_JVM_ENDPOINT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs surrealdb
          exit 1

      - name: Run JVM tests
        run: ./gradlew --no-daemon jvmTest

      - name: SurrealDB logs
        if: always()
        run: docker logs surrealdb || true

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Run iOS simulator tests
        run: ./gradlew --no-daemon :kotlin:iosSimulatorArm64Test

      - name: Confirm the iOS tests actually ran
        # A test task that compiles nothing and runs nothing still exits 0. These
        # tests went uncompiled for months precisely because no job looked, so
        # assert a real count rather than trusting the exit status.
        run: |
          count=$(cat kotlin/build/test-results/iosSimulatorArm64Test/*.xml | grep -c '<testcase')
          echo "iOS tests run: $count"
          test "$count" -gt 0

      - name: iOS test report
        if: failure()
        run: cat kotlin/build/test-results/iosSimulatorArm64Test/*.xml || true
