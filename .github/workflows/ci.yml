name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Check formatting
        run: ./gradlew --no-daemon ktlintCheck

      - name: Verify the core boundary and compile classpath
        run: ./gradlew --no-daemon verifyCoreQueryBoundary verifyCoreQueryClasspath

      - name: Compile the JVM quickstart
        run: ./gradlew --no-daemon :samples:jvm-quickstart:compileKotlin

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the API documentation
        run: ./gradlew --no-daemon :dokkaGeneratePublicationHtml javadocJar

      - name: Confirm the docs and the javadoc jars have content
        run: |
          test -s build/dokka/html/index.html
          pages=$(find build/dokka/html -name '*.html' | wc -l)
          echo "rendered pages: $pages"
          test "$pages" -gt 50
          for jar in surrealdb-kotlin-core/build/libs/*-javadoc.jar surrealdb-kotlin-query/build/libs/*-javadoc.jar surrealdb-kotlin-spectron/build/libs/*-javadoc.jar; do
            entries=$(unzip -l "$jar" | tail -1 | awk '{print $2}')
            echo "$jar: $entries entries"
            test "$entries" -gt 50
          done

      - name: Upload the API documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: build/dokka/html

  jvm:
    name: jvm (${{ matrix.surrealdb }})
    runs-on: ubuntu-latest
    # A green run against a floating tag changes meaning whenever SurrealDB
    # publishes, without a commit here. The pinned version is what the suite is
    # developed against and is the one that can fail the build; `latest` rides
    # along as an early warning that a future server release breaks the client,
    # non-blocking because that is someone else's release, not this change.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - surrealdb: "surrealdb/surrealdb:v3.2.4"
            blocking: true
          - surrealdb: "surrealdb/surrealdb:latest"
            blocking: false
    env:
      SURREAL_RUN_INTEGRATION: "true"
      SURREAL_JVM_ENDPOINT: "http://127.0.0.1:8000"
      SURREALDB_IMAGE: ${{ matrix.surrealdb }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify publication metadata
        run: ./gradlew --no-daemon verifyPublicationCoordinates verifyPublicationJavadoc

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 "$SURREALDB_IMAGE" start --user root --pass root memory
          for i in {1..20}; do
            if curl -fsS "$SURREAL_JVM_ENDPOINT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs surrealdb
          exit 1

      - name: Run JVM tests
        run: ./gradlew --no-daemon jvmTest

      - name: SurrealDB logs
        if: always()
        run: docker logs surrealdb || true

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Run iOS simulator tests
        run: ./gradlew --no-daemon :surrealdb-kotlin-core:iosSimulatorArm64Test :surrealdb-kotlin-query:iosSimulatorArm64Test

      - name: Confirm the iOS tests actually ran
        # A test task that compiles nothing and runs nothing still exits 0. These
        # tests went uncompiled for months precisely because no job looked, so
        # assert a real count rather than trusting the exit status.
        run: |
          count=$(cat surrealdb-kotlin-core/build/test-results/iosSimulatorArm64Test/*.xml surrealdb-kotlin-query/build/test-results/iosSimulatorArm64Test/*.xml | grep -c '<testcase')
          echo "iOS tests run: $count"
          test "$count" -gt 0

      - name: iOS test report
        if: failure()
        run: cat surrealdb-kotlin-core/build/test-results/iosSimulatorArm64Test/*.xml surrealdb-kotlin-query/build/test-results/iosSimulatorArm64Test/*.xml || true

  android:
    runs-on: ubuntu-latest
    env:
      SURREALDB_IMAGE: "surrealdb/surrealdb:v3.2.4"
      SURREAL_HOST_ENDPOINT: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Enable KVM
        # Without it the x86_64 emulator falls back to software emulation and the
        # job runs long enough to be useless.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 "$SURREALDB_IMAGE" start --user root --pass root memory
          for i in {1..20}; do
            if curl -fsS "$SURREAL_HOST_ENDPOINT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs surrealdb
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # The test runs inside the emulator, where the runner's environment does
          # not exist — the gate and the endpoint have to arrive as instrumentation
          # arguments. 10.0.2.2 is the host loopback as seen from the emulator.
          script: >
            ./gradlew --no-daemon :surrealdb-kotlin-query:connectedAndroidDeviceTest
            -Pandroid.testInstrumentationRunnerArguments.SURREAL_RUN_INTEGRATION=true
            -Pandroid.testInstrumentationRunnerArguments.SURREAL_ANDROID_ENDPOINT=http://10.0.2.2:8000

      - name: Confirm the Android tests actually ran
        # As with the iOS job, a task that runs nothing still exits 0. A skipped
        # count is checked too: the gate above is an assumption, and an assumption
        # that fails reports as a pass while testing nothing at all.
        run: |
          results="surrealdb-kotlin-query/build/outputs/androidTest-results/connected"
          shopt -s nullglob globstar
          files=("$results"/**/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no instrumented test results under $results"
            exit 1
          fi
          count=$(cat "${files[@]}" | grep -c '<testcase' || true)
          skipped=$(cat "${files[@]}" | grep -c '<skipped' || true)
          echo "Android tests run: $count (skipped: $skipped)"
          test "$count" -gt 0
          test "$skipped" -eq 0

      - name: Android test report
        if: failure()
        run: find surrealdb-kotlin-query/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -exec cat {} + || true

      - name: SurrealDB logs
        if: always()
        run: docker logs surrealdb || true
